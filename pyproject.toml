[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eostac"
version = "0.1.0"
description = "A Python library for searching and downloading satellite imagery via STAC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pystac>=1.10.0",
    "pystac-client>=0.8.0",
    "rioxarray>=0.17.0",
    "geopandas>=1.0.0",
    "shapely>=2.0.0",
    "httpx>=0.27.0",
    "tqdm>=4.66.0",
    "folium>=0.17.0",
    "Pillow>=10.0.0",
    "ipywidgets>=8.1.8",
    "xarray>=2025.6.1",
    "rasterio>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "responses>=0.25.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eostac"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = ["--strict-markers"]
markers = [
    "integration: requires network access",
    "unit: fast in-process tests with no real I/O",
]
